<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191919">

<link rel="icon" href="icon-192.png">

<title>벤치마크 조회</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:0;height:56px}
header h1{font-size:17px;font-weight:500;margin:0;flex:1}
#srbtn{border:.5px solid var(--bd2);background:var(--card);color:var(--tx);border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#srbtn svg{width:18px;height:18px}
.subs{position:sticky;top:56px;z-index:4;background:var(--bg);padding:2px 0 8px;margin:0 0 4px;border-bottom:.5px solid var(--bd)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:.5px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{border:0;background:transparent;color:var(--tx3);font:inherit;font-size:11.5px;white-space:nowrap;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--ac);font-weight:500}
#back{display:none;border:0;background:transparent;color:var(--tx);font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 12px}
.gh3{font-size:13px;font-weight:500;color:var(--tx2);margin:14px 2px 6px}
.gh3:first-child{margin-top:4px}
.tile{display:block;text-align:left;background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:14px 12px;color:var(--tx);cursor:pointer;font:inherit;min-height:84px}
.tile b{display:block;font-size:15px;font-weight:500;margin-bottom:4px}
.tile span{font-size:12px;color:var(--tx2);line-height:1.45}
.srch{width:100%;height:44px;border:.5px solid var(--bd2);border-radius:10px;padding:0 12px;font-size:16px;background:var(--card);color:var(--tx)}
.srch:focus{outline:2px solid var(--ac);outline-offset:0}
.lnk{display:block;width:100%;text-align:left;margin:10px 0 0;padding:12px;background:transparent;border:.5px solid var(--bd2);border-radius:10px;color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chips{margin:2px 0 4px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font:inherit;font-size:13px;padding:6px 12px;border:.5px solid var(--bd2);border-radius:999px;color:var(--tx2);background:transparent;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.clab{font-size:12px;color:var(--tx3);margin:8px 0 2px}
.sec{margin:18px 0 0}
.sec h2{font-size:15px;font-weight:500;margin:0 0 2px}
.cap{font-size:12px;color:var(--tx2);margin:0 0 8px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:.5px solid var(--bd);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;font-size:12px;text-align:left;color:var(--tx2);padding:8px 8px 6px;border-bottom:.5px solid var(--bd2);white-space:nowrap}
th.v{text-align:right}
td{padding:9px 8px;border-bottom:.5px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
td.rl{font-size:13px;min-width:92px}
td.v{text-align:right;font-weight:500;white-space:nowrap;cursor:pointer}
td.v:active{background:var(--hl)}
td.v small{display:block;font-size:11px;font-weight:400;color:var(--tx3)}
td.v sup{color:var(--wn);font-weight:400}
td.na{color:var(--tx3);font-weight:400;cursor:default}
.foot{font-size:12px;color:var(--tx3);margin:6px 2px 0;line-height:1.5}
.lst{background:var(--card);border:.5px solid var(--bd);border-radius:12px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-bottom:.5px solid var(--bd);cursor:pointer;font-size:14px}
.li:last-child{border-bottom:0}
.li .r{text-align:right;white-space:nowrap;font-weight:500}
.li small{display:block;font-size:12px;color:var(--tx2);font-weight:400}
.bd{display:inline-block;font-size:11px;padding:1px 7px;border:.5px solid var(--bd2);border-radius:6px;color:var(--tx2);white-space:nowrap;font-weight:400}
.bd.es{color:var(--wn);border-color:var(--wn)}
.sd{background:var(--card);border:.5px solid var(--bd);border-radius:12px;margin:0 0 8px}
.sd summary{padding:11px 12px;cursor:pointer;font-size:14px}
.sd summary span{color:var(--tx3);font-size:12px}
.sd .lst{border:0;border-top:.5px solid var(--bd);border-radius:0 0 12px 12px}
.li small.fl{color:var(--wn)}
.rbw{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:4px 12px}
.rb{padding:10px 0;border-bottom:.5px solid var(--bd)}.rb:last-child{border-bottom:0}
.rbh{display:flex;justify-content:space-between;gap:8px;font-size:14px}.rbh b{font-weight:500}.rbh small{color:var(--tx3);font-size:12px}
.rax{position:relative;height:22px;margin:2px 6px}.rax i{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--bd2)}
.rdot{position:absolute;top:5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ac);opacity:.85;cursor:pointer}.rdot.o{background:var(--card);border:1.5px solid var(--wn);opacity:1}
.vcs{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px}
.vc{font:inherit;font-size:12px;border:.5px solid var(--bd);background:transparent;color:var(--tx2);border-radius:999px;padding:3px 9px;cursor:pointer}.vc b{font-weight:500;color:var(--tx)}.vc.o b{color:var(--wn)}
.warn{background:var(--wnbg);color:var(--wn);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:6px 14px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.open #ov,.open #sheet{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bd2);margin:4px auto 8px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sh-top h3{font-size:14px;font-weight:500;margin:0;color:var(--tx2)}
.x{border:0;background:transparent;color:var(--tx2);font-size:22px;line-height:1;padding:0 2px;cursor:pointer}
.big{font-size:30px;font-weight:500;line-height:1.15;margin:4px 0 2px}
.kv{font-size:13px;color:var(--tx2);margin:2px 0}
.kv b{font-weight:500;color:var(--tx)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.b{font:inherit;font-size:13px;padding:6px 12px;border:.5px solid var(--bd2);border-radius:8px;background:transparent;color:var(--tx);cursor:pointer;text-decoration:none}
.dt{margin:22px 0 0;border-top:.5px solid var(--bd2);padding-top:10px}
.dt summary{font-size:15px;font-weight:500;cursor:pointer;padding:6px 0;color:var(--tx)}
.cmp h4{font-size:13px;font-weight:500;margin:16px 0 6px}
.li.me{background:var(--acbg)}
/* search */
.bar{display:flex;gap:8px;margin-top:8px;align-items:center}
select{flex:1;min-width:0;height:36px;border:.5px solid var(--bd2);border-radius:8px;background:var(--card);color:var(--tx);font-size:13px;padding:0 6px}
label.tg{font-size:13px;color:var(--tx2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.sum{font-size:13px;color:var(--tx2);margin:10px 0}
.grp{margin:0 0 18px}
.gh b{font-weight:500;font-size:15px}
.gh .df{font-size:12px;color:var(--tx2);margin-top:2px}
.gh .cn{font-size:12px;color:var(--wn);margin-top:2px}
.empty{text-align:center;color:var(--tx2);padding:36px 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:30}
</style>
</head>

  var multi=Object.keys(famMet).filter(function(f){return famMet[f].length>1});
  var h='<div class="sum">'+res.length+"건, 지표 "+order.length+"종</div>";
  if(multi.length)h+='<div class="warn">같은 분류 안에 정의가 다른 지표가 섞여 있습니다('+esc(multi.join(", "))+"). 각 지표의 정의를 확인하십시오.</div>";
  order.forEach(function(k){
    var m=M[k]||{},rows=by[k],lim=shown[k]||8;
    h+='<section class="grp"><div class="gh"><b>'+esc(m.name_ko||k)+'</b><div class="df">'+esc(m.definition||"")+"</div>";
    if(m.comparability_note)h+='<div class="cn">주의: '+esc(m.comparability_note)+"</div>";
    h+='</div><div class="lst" style="margin-top:6px">';
    rows.slice(0,lim).forEach(function(r){
      var es=!isOrig(F(r,"nature")),bits=[F(r,"n")?"n="+nf(F(r,"n")):"",F(r,"period"),sname(r)+(F(r,"location")?", "+F(r,"location"):"")].filter(Boolean).join(", ");
      h+='<div class="li" data-id="'+esc(F(r,"stat_id"))+'" data-ck="'+esc(autoCk(r))+'"><div>'+esc(label(r))+"<small>"+esc(bits)+'</small></div><div class="r">'+esc(fmt(r))+'<small><span class="bd'+(es?" es":"")+'">'+esc(natS(F(r,"nature")))+"</span></small></div></div>";
    });
    h+="</div>";
    if(rows.length>lim)h+='<button class="b" style="width:100%;margin-top:6px" data-more="'+esc(k)+'">'+(rows.length-lim)+"건 더 보기</button>";
    h+="</section>";
  });
  out.innerHTML=h;
}
function autoCk(r){
  var mid=F(r,"metric_id"),st=F(r,"stage");
  for(var k in PST){var s=PST[k];
    if(/_TRANS$/.test(mid)&&st===s[0])return"trans:"+k;
    if(/_LOA$/.test(mid)&&st===s[1])return"loa:"+k;
    if(mid==="BIO2021_DURATION"&&st===s[0])return"dur:"+k;
    if((mid==="PAUL_PTS"||mid==="MORGAN_STAGE_SUCCESS"||mid==="COOK_STAGE_SUCCESS")&&st===s[2])return"trans:"+k;
    if(mid==="PAUL_CYCLE"&&st===s[2])return"dur:"+k;
    if((mid==="DOWDEN_PROGRESSION"||mid==="DOWDEN_AREA"||mid==="PAUL_CUM")&&st===s[3])return"loa:"+k;
  }
  if(mid==="BIO2021_DURATION"&&st==="Phase I->Approval")return"dur:T";
  var dm={NEU_AVG_PAYMENT:{Upfront:"up","Total deal":"tot"},NEU_COMPOSITION:{Upfront:"ush"}}[mid];
  if(dm&&dm[F(r,"segment")])return dm[F(r,"segment")]+":"+dn(st);
  var dd={BTG_AVG_UPFRONT:"up",TRI_MEDIAN_UPFRONT:"up",PULLAN_UPFRONT:"up",BTG_AVG_DEALVALUE:"tot",BTG_UPFRONT_SHARE:"ush",TRI_MEDIAN_ROYALTY:"roy"}[mid];
  if(dd&&st)return dd+":"+dn(st);
  if(mid==="BTG_ROYALTY")return"roy:전체";
  if(mid==="MCK_SHARE10"||mid==="RIDLEY_PEAK")return ord(r)&&ord(r)!=="all"?"shr:"+ord(r):"";
  if(mid==="MCK_ADV")return"adv:"+ord(r);
  return"";
}
/* ---------- router ---------- */
var TABS={p:["성공확률",[["pos","BIO 비교표"],["pose","문헌별 성공률"],["fail","실패 원인"],["pred","예측 연구"]]],t:["개발 기간",[["dur","단계와 심사 기간"]]],d:["딜과 M&A",[["deal","라이선스 조건"],["ma","M&A, 투자 수익률"]]],s:["매출 추정",[["share","출시 순서 점유율"],["fc","출시 곡선, 예측"]]],f:["비용과 재무",[["rate","할인율, WACC"],["cost","개발비"],["fin","원가, 판관비, 세율"]]]};
var V2T={};Object.keys(TABS).forEach(function(t){TABS[t][1].forEach(function(x){V2T[x[0]]=t})});
var TT={list:"통계 전체 목록",search:"검색과 정보"};Object.keys(TABS).forEach(function(t){TABS[t][1].forEach(function(x){TT[x[0]]=TABS[t][0]})});
var VIEWS;
function lastOf(t){try{var v=localStorage.getItem("bm_tab_"+t);if(v&&V2T[v]===t)return v}catch(e){}return TABS[t][1][0][0]}
function route(){
  if(sheetOpen)closeSheet();
  var h=location.hash.replace(/^#\/?/,""),v=h.split("?")[0];
  VIEWS=VIEWS||{rate:vRate,cost:vCost,fin:vFin,pos:vPos,pose:vPosEtc,fail:vFail,pred:vPred,dur:vDur,deal:vDeal,ma:vMA,share:vShare,fc:vFc,list:vList,search:vSearch};
  if(!TT.hasOwnProperty(v)){var lt="p";try{lt=localStorage.getItem("bm_last_tab")||"p"}catch(e){}if(!TABS[lt])lt="p";location.replace("#"+lastOf(lt));return}
  var t=V2T[v]||"";
  $("ttl").textContent=TT[v];$("back").style.display=t?"none":"block";$("srbtn").style.display=t?"flex":"none";
  if(t){try{localStorage.setItem("bm_tab_"+t,v);localStorage.setItem("bm_last_tab",t)}catch(e){}}
  var sb=$("subs");
  if(t&&TABS[t][1].length>1){sb.style.display="block";sb.innerHTML='<div class="chips" role="tablist">'+TABS[t][1].map(function(x){return'<button class="chip'+(x[0]===v?" on":"")+'" role="tab" aria-selected="'+(x[0]===v)+'" data-sub="'+x[0]+'">'+esc(x[1])+"</button>"}).join("")+"</div>"}
  else{sb.style.display="none";sb.innerHTML=""}
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){var on=b.getAttribute("data-tab")===t;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
  $("view").innerHTML=VIEWS[v]();window.scrollTo(0,0);
  if(v==="search")initSearch();
}
function rerender(){var y=window.scrollY,v=location.hash.replace(/^#\/?/,"");if(!VIEWS[v]||v==="search")return;$("view").innerHTML=VIEWS[v]();window.scrollTo(0,y)}
$("back").addEventListener("click",function(){if(history.length>1)history.back();else location.hash=""});
$("srbtn").addEventListener("click",function(){location.hash="search"});
$("subs").addEventListener("click",function(e){var b=e.target.closest("[data-sub]");if(b)location.replace("#"+b.getAttribute("data-sub"))});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(!b)return;var t=b.getAttribute("data-tab"),cur=V2T[location.hash.replace(/^#\/?/,"")];if(cur===t){window.scrollTo({top:0,behavior:"smooth"});return}location.hash=lastOf(t)});
$("view").addEventListener("click",function(e){
  var t=e.target,b;
  b=t.closest("[data-go]");if(b){location.hash=b.getAttribute("data-go");return}
  b=t.closest(".chip");if(b){var g=b.parentNode.getAttribute("data-chip");ST[g]=b.getAttribute("data-v");if(g==="posDim")ST.posOpt="";save();rerender();return}
  b=t.closest("[data-fam]");if(b){SQ={q:"",f:b.getAttribute("data-fam"),sc:"",og:false};location.hash="search";return}
  b=t.closest("[data-more]");if(b){var k=b.getAttribute("data-more");shown[k]=(shown[k]||8)+30;render();return}
  b=t.closest("[data-id]");if(b){openSheet(b.getAttribute("data-id"),b.getAttribute("data-ck"));return}
});
window.addEventListener("hashchange",route);
route();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
