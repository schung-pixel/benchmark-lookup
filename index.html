<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191919">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>벤치마크 조회</title>
<style>
:root{--bg:#f5f4ee;--card:#fff;--tx:#1f1f1e;--tx2:#5f5e5a;--tx3:#888780;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.22);--ac:#185fa5;--acbg:#e6f1fb;--wn:#854f0b;--wnbg:#faeeda;--ok:#3b6d11}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--card:#262624;--tx:#ececea;--tx2:#a9a8a2;--tx3:#807f79;--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.24);--ac:#85b7eb;--acbg:#0c447c;--wn:#fac775;--wnbg:#412402;--ok:#97c459}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
header{padding:10px 0 4px}
.sq{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
h1{font-size:17px;font-weight:500;margin:0 0 8px}
#q{width:100%;height:42px;border:.5px solid var(--bd2);border-radius:10px;padding:0 12px;font-size:16px;background:var(--card);color:var(--tx)}
#q:focus{outline:2px solid var(--ac);outline-offset:0}
.bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
select{flex:1;min-width:0;height:34px;border:.5px solid var(--bd2);border-radius:8px;background:var(--card);color:var(--tx);font-size:13px;padding:0 6px;max-width:100%}
label.tg{font-size:13px;color:var(--tx2);display:flex;gap:6px;align-items:center}
.chips{margin:8px 0 0}
.chip{display:inline-block;font-size:13px;padding:5px 11px;border:.5px solid var(--bd2);border-radius:999px;margin:0 6px 6px 0;color:var(--tx2);background:transparent;cursor:pointer}
.chip.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.sum{font-size:13px;color:var(--tx2);margin:6px 0 10px}
.warn{background:var(--wnbg);color:var(--wn);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 10px}
.grp{margin:0 0 18px}
.gh{padding:0 2px 6px}
.gh b{font-weight:500;font-size:15px}
.gh .df{font-size:12px;color:var(--tx2);margin-top:2px}
.gh .cn{font-size:12px;color:var(--wn);margin-top:2px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.val{font-size:26px;font-weight:500;line-height:1.15}
.bd{font-size:11px;padding:2px 8px;border:.5px solid var(--bd2);border-radius:6px;color:var(--tx2);white-space:nowrap}
.bd.es{color:var(--wn);border-color:var(--wn)}
.lbl{font-size:14px;font-weight:500;margin-top:2px}
.sub{font-size:12px;color:var(--tx2);margin-top:1px}
.det{display:none;border-top:.5px solid var(--bd);margin-top:8px;padding-top:8px;font-size:12px;color:var(--tx2)}
.card.open .det{display:block}
.det p{margin:0 0 4px}
.act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.b,a.b{font-size:12px;padding:5px 10px;border:.5px solid var(--bd2);border-radius:8px;background:transparent;color:var(--tx);cursor:pointer;text-decoration:none}
.more{width:100%;margin:2px 0 6px;padding:8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:.5px solid var(--bd);border-radius:10px;overflow:hidden}
th{font-weight:500;text-align:left;color:var(--tx2);padding:7px 8px;border-bottom:.5px solid var(--bd2);white-space:nowrap}
td{padding:7px 8px;border-bottom:.5px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap;font-weight:500}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:var(--tx2);padding:36px 12px;font-size:14px}
footer{font-size:12px;color:var(--tx3);margin-top:24px;line-height:1.6}
.ex{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 6px;background:var(--card);border:.5px solid var(--bd);border-radius:10px;color:var(--tx);font-size:14px;cursor:pointer}
.ex small{display:block;color:var(--tx2);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>벤치마크 조회</h1>
<div class="sq"><input id="q" type="search" placeholder="Phase II 성공확률 종양" autocomplete="off" enterkeyhint="search"></div>
<div class="bar">
<select id="fam" aria-label="지표 분류"><option value="">분류 전체</option></select>
<select id="src" aria-label="출처 문헌"><option value="">문헌 전체</option></select>
<label class="tg"><input type="checkbox" id="orig"> 원문값만</label>
</div>
</header>
<div id="out"></div>
<footer id="foot"></footer>
</div>
<div id="toast"></div>
<script src="data.js"></script>
<script>
(function(){
var DB=window.DB,C={};DB.cols.forEach(function(c,i){C[c]=i});
var R=DB.rows,S=DB.sources,M=DB.metrics;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var ROM={"1":"i","2":"ii","3":"iii","4":"iv"};
var AL={"p1":"phase i","1상":"phase i","임상1상":"phase i","p2":"phase ii","2상":"phase ii","임상2상":"phase ii","p3":"phase iii","3상":"phase iii","임상3상":"phase iii","전임상":"preclinical","출시":"launch","허가":"approval",
"성공확률":["단계 성공확률","누적 성공확률","loa"],"성공률":["단계 성공확률","누적 성공확률","loa"],"승인확률":["loa"],"전이율":["전이"],
"종양":"oncology","항암":["oncology","anticancer"],"비종양":"non-oncology","희귀":"rare","백신":"vaccine","바이오마커":"biomarker","혈액":"hematolog","중추신경":["cns","nervous","neurology"],"감염":"infect","자가면역":"autoimmune",
"선급금":["선급금","upfront"],"로열티":["로열티","royalt"],"마일스톤":["마일스톤","milestone"],"점유율":"점유율","출시순서":"출시 순서","소요기간":["소요 기간","duration"],"기간":["소요 기간","duration"],"저분자":["저분자","small molecule"],"항체":["monoclonal antibody","antibody"]};
var STG=/^phase(?:\s*)(i{1,3}|iv|[1-4])$/;
function alts(t){
  t=t.toLowerCase();var m=t.match(STG);
  if(m){var r=ROM[m[1]]||m[1];return [{re:new RegExp("phase "+r+"(?![ivx])")}]}
  var a=AL[t],out=[],i;
  if(a){a=[].concat(a);for(i=0;i<a.length;i++){var x=a[i];out.push(STG.test(x)?{re:new RegExp(x.replace(/phase (\w+)/,"phase $1")+"(?![ivx])")}:{s:x})}}
  out.push(t==="oncology"||t==="종양"?{re:/(^|[^a-z-])oncology/}:{s:t});
  if(a&&a.indexOf("oncology")>-1)out[0]={re:/(^|[^a-z-])oncology/};
  return out;
}
var HAY=R.map(function(r){
  var m=M[r[C.metric_id]]||{},s=S[r[C.source_id]]||{};
  return [m.name_ko,m.family,r[C.stage],r[C.segment],r[C.indication],r[C.modality],r[C.population],r[C.period],r[C.location],s.authors,s.year,r[C.source_id],r[C.stat_type],r[C.nature],r[C.metric_id]].join(" | ").toLowerCase();
});
function fmt(r){
  var ap=r[C.as_published],nat=r[C.nature],v=r[C.value],u=r[C.unit];
  if(ap&&nat.indexOf("파생")<0)return ap;
  if(v==="")return"-";var x=parseFloat(v);
  if(u==="fraction")return(x*100).toFixed(1)+"%";
  if(u==="%p")return(x>0?"+":"")+x.toFixed(1)+"%p";
  if(u==="배")return x.toFixed(2)+"배";
  if(u.indexOf("계수")===0)return String(+x.toPrecision(6));
  return String(+x.toPrecision(6))+u;
}
function isOrig(n){return n.indexOf("추정")!==0&&n.indexOf("파생")!==0&&n.indexOf("가정")<0&&n.indexOf("가상")<0}
function label(r){
  var p=[],st=r[C.stage],ind=r[C.indication],mo=r[C.modality],sg=r[C.segment];
  if(st&&st!=="All")p.push(st);if(ind&&ind!=="전체")p.push(ind);if(mo&&mo!=="전체")p.push(mo);if(sg&&sg!=="전체")p.push(sg);
  var t=r[C.stat_type];if(t&&t!=="point")p.push("("+t+")");
  return p.length?p.join(" / "):"전체";
}
function cite(r){
  var s=S[r[C.source_id]]||{},loc=r[C.location];
  return s.authors+" "+s.year+(loc?", "+loc:"");
}
function full(r){
  var s=S[r[C.source_id]]||{},m=M[r[C.metric_id]]||{};
  var a=[m.name_ko+" ("+label(r)+"): "+fmt(r)];
  if(r[C.n])a.push("n="+r[C.n]);if(r[C.period])a.push(r[C.period]);
  a.push(cite(r));a.push(r[C.nature]);
  return a.join(", ");
}
var fams=[],famN={};
Object.keys(M).forEach(function(k){var f=M[k].family;if(f&&fams.indexOf(f)<0)fams.push(f)});
R.forEach(function(r){var f=(M[r[C.metric_id]]||{}).family;famN[f]=(famN[f]||0)+1});
fams.sort();
fams.forEach(function(f){if(famN[f]){var o=document.createElement("option");o.value=f;o.textContent=f+" ("+famN[f]+")";$("fam").appendChild(o)}});
Object.keys(S).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=S[k].authors+" "+S[k].year;$("src").appendChild(o)});

var openState={},tableState={},shown={};
function search(){
  var q=$("q").value.trim(),f=$("fam").value,sc=$("src").value,og=$("orig").checked;
  var toks=q?q.replace(/phase\s+(i{1,3}|iv|\d)(?![a-z])/gi,"phase$1").split(/\s+/).filter(Boolean):[];
  var groups=toks.map(alts);
  var res=[];
  for(var i=0;i<R.length;i++){
    var r=R[i];
    if(f&&(M[r[C.metric_id]]||{}).family!==f)continue;
    if(sc&&r[C.source_id]!==sc)continue;
    if(og&&!isOrig(r[C.nature]))continue;
    var h=HAY[i],ok=true;
    for(var g=0;g<groups.length&&ok;g++){
      var hit=false;
      for(var a=0;a<groups[g].length;a++){var x=groups[g][a];if(x.re?x.re.test(h):h.indexOf(x.s)>-1){hit=true;break}}
      ok=hit;
    }
    if(ok)res.push(r);
  }
  return {res:res,q:q,f:f,sc:sc};
}
function render(){
  var o=search(),out=$("out"),res=o.res;
  if(!o.q&&!o.f&&!o.sc){home();return}
  if(!res.length){out.innerHTML='<div class="empty">일치하는 통계가 없습니다.<br>키워드를 줄이거나 분류, 문헌 필터를 해제해 보십시오.</div>';return}
  var by={},order=[];
  res.forEach(function(r){var k=r[C.metric_id];if(!by[k]){by[k]=[];order.push(k)}by[k].push(r)});
  var famMet={};
  order.forEach(function(k){var m=M[k]||{};if((m.name_ko||"").indexOf("(파생)")<0){(famMet[m.family]=famMet[m.family]||[]).push(k)}});
  var multi=Object.keys(famMet).filter(function(f){return famMet[f].length>1});
  var h='<div class="sum">'+res.length+'건, 지표 '+order.length+'종</div>';
  if(multi.length)h+='<div class="warn">같은 분류 안에 정의가 다른 지표가 섞여 있습니다('+esc(multi.join(", "))+'). 값끼리 직접 비교하지 말고 각 지표의 정의를 확인하십시오.</div>';
  order.forEach(function(k){
    var m=M[k]||{},rows=by[k],lim=shown[k]||5,tb=tableState[k];
    h+='<section class="grp"><div class="gh"><b>'+esc(m.name_ko||k)+'</b><div class="df">'+esc(m.definition||"")+'</div>';
    if(m.comparability_note)h+='<div class="cn">주의: '+esc(m.comparability_note)+'</div>';
    h+='</div>';
    if(tb){
      h+='<div class="tw"><table><tr><th>구분</th><th>값</th><th>n</th><th>기간</th><th>출처</th></tr>';
      rows.forEach(function(r){h+='<tr><td>'+esc(label(r))+'</td><td class="n">'+esc(fmt(r))+'</td><td class="n">'+esc(r[C.n])+'</td><td>'+esc(r[C.period])+'</td><td>'+esc(cite(r))+(isOrig(r[C.nature])?'':' <span class="bd es">'+esc(r[C.nature].replace(/\(.*$/,""))+'</span>')+'</td></tr>'});
      h+='</table></div>';
    }else{
      rows.slice(0,lim).forEach(function(r){h+=card(r)});
      if(rows.length>lim)h+='<button class="b more" data-more="'+esc(k)+'">'+(rows.length-lim)+'건 더 보기</button>';
    }
    if(rows.length>1)h+='<div class="act"><button class="b" data-tb="'+esc(k)+'">'+(tb?'카드로 보기':'표로 비교 ('+rows.length+'행)')+'</button></div>';
    h+='</section>';
  });
  out.innerHTML=h;
}
function card(r){
  var id=r[C.stat_id],s=S[r[C.source_id]]||{},nat=r[C.nature],open=openState[id];
  var h='<div class="card'+(open?' open':'')+'" data-id="'+esc(id)+'"><div class="top"><span class="val">'+esc(fmt(r))+'</span><span class="bd'+(isOrig(nat)?'':' es')+'">'+esc(nat)+'</span></div>';
  h+='<div class="lbl">'+esc(label(r))+'</div>';
  h+='<div class="sub">'+[r[C.n]?"n="+r[C.n]:"",r[C.period],cite(r)].filter(Boolean).map(esc).join(" · ")+'</div>';
  h+='<div class="det">';
  if(r[C.population])h+='<p>모집단: '+esc(r[C.population])+'</p>';
  if(r[C.note])h+='<p>비고: '+esc(r[C.note])+'</p>';
  h+='<p>'+esc(s.title)+', '+esc(s.journal_or_publisher)+'</p>';
  var ln=[];
  if(s.doi)ln.push('<a class="b" href="https://doi.org/'+esc(s.doi)+'" target="_blank" rel="noopener">DOI</a>');
  if(s.pmid)ln.push('<a class="b" href="https://pubmed.ncbi.nlm.nih.gov/'+esc(s.pmid)+'/" target="_blank" rel="noopener">PubMed</a>');
  h+='<div class="act"><button class="b" data-copy="'+esc(id)+'">인용문 복사</button>'+ln.join("")+'</div></div></div>';
  return h;
}
var EX=[["Phase II 성공확률 종양","적응증별 단계 전이율"],["로열티","딜 구조 로열티율"],["Phase III 선급금","체결 단계별 선급금"],["출시순서 점유율","시장점유율"],["소요기간 Phase II","단계별 소요 기간"]];
function home(){
  var h='<div class="sum">검색어를 입력하거나 예시를 눌러 보십시오. 수록 통계 '+R.length+'건</div>';
  EX.forEach(function(e){h+='<button class="ex" data-ex="'+esc(e[0])+'">'+esc(e[0])+'<small>'+esc(e[1])+'</small></button>'});
  $("out").innerHTML=h;
}
var byId={};R.forEach(function(r){byId[r[C.stat_id]]=r});
$("out").addEventListener("click",function(e){
  var t=e.target,b=t.closest("[data-ex]");
  if(b){$("q").value=b.getAttribute("data-ex");render();return}
  b=t.closest("[data-tb]");if(b){var k=b.getAttribute("data-tb");tableState[k]=!tableState[k];render();return}
  b=t.closest("[data-more]");if(b){var k2=b.getAttribute("data-more");shown[k2]=(shown[k2]||5)+20;render();return}
  b=t.closest("[data-copy]");
  if(b){var tx=full(byId[b.getAttribute("data-copy")]);
    var done=function(){toast("복사했습니다")};
    if(navigator.clipboard)navigator.clipboard.writeText(tx).then(done,function(){toast("복사하지 못했습니다")});else toast("복사하지 못했습니다");return}
  if(t.closest("a"))return;
  var c=t.closest(".card");if(c){var id=c.getAttribute("data-id");openState[id]=!openState[id];c.classList.toggle("open")}
});
var tmr;function toast(s){var e=$("toast");e.textContent=s;e.style.display="block";clearTimeout(tmr);tmr=setTimeout(function(){e.style.display="none"},1500)}
var dt;$("q").addEventListener("input",function(){clearTimeout(dt);dt=setTimeout(function(){shown={};render()},120)});
["fam","src","orig"].forEach(function(i){$(i).addEventListener("change",function(){shown={};render()})});
$("foot").innerHTML='수치는 각 문헌의 원문 값을 옮긴 것이며, 값의 성격(원문값, 추정, 파생)을 카드마다 표시합니다. 보고서에 인용하기 전에 원문으로 확인하십시오. 원문 PDF는 포함하지 않으며 DOI 링크로 연결합니다. 데이터 기준일 '+esc(DB.built)+'.';
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
